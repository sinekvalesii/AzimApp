<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0908">
<title>AZİM · 66 Gün</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="AZİM: Alışkanlıklarını oyuna çevir. Saatli görevler, XP, seri koruma ve 66 günlük program.">
<style>
:root{--bg:#0a0908;--s1:#131110;--s2:#1a1816;--s3:#221f1c;--ln:#2b2723;--ln2:#3d3832;--tx:#f1ebe2;--mu:#8b837a;--mu2:#5f5952;--or:#ee7a2f;--or2:#a8511d;--or3:#3a2216;--gd:#d6a443;--gn:#62d08e;--rd:#ff6464;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#000}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#000;color:var(--tx);font-family:Archivo,system-ui,sans-serif;display:flex;justify-content:center;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font-family:inherit;color:inherit;cursor:pointer}
.app{width:100%;max-width:440px;min-height:100vh;background:var(--bg);position:relative;padding-top:var(--safe-t);overflow-x:hidden}
.d{font-stretch:62%;font-weight:900;text-transform:uppercase;line-height:.88}
.w{font-stretch:125%;font-weight:800;letter-spacing:-.025em}
.m{font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.14em;font-size:10.5px;color:var(--mu);font-weight:500}
.or{color:var(--or)}.mu{color:var(--mu)}
#scr{padding:16px 18px 110px;animation:fi .25s ease}
#scr.ob{min-height:calc(100vh - var(--safe-t));display:flex;flex-direction:column;padding:22px 20px calc(24px + var(--safe-b))}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 10px;border:1.5px solid var(--ln2);border-radius:7px;background:var(--s1);font-weight:700;font-size:13.5px}
.chip.hot{border-color:var(--or2);background:var(--or3);color:var(--or)}
.bx{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--ln2);border-radius:7px;background:var(--s2);box-shadow:3px 3px 0 #000;flex:none}
.bx:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
.bx.off{opacity:.3;pointer-events:none}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:56px;border:0;border-radius:10px;background:var(--or);color:#140a03;font-family:'JetBrains Mono';font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;margin-top:14px}
.cta:active{filter:brightness(.92)}.cta:disabled{opacity:.35}
.cta.ghost{background:transparent;border:1.5px solid var(--ln2);color:var(--tx)}
.cta.sm{height:44px;font-size:11.5px;margin-top:10px}
.cta.red{background:var(--rd);color:#fff}
.lnk{background:none;border:0;color:var(--mu);font-size:14px;margin-top:14px;width:100%;text-align:center}.lnk b{color:var(--tx)}
.panel{border:1.5px solid var(--ln);border-radius:12px;background:var(--s1);padding:16px;margin-top:14px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;gap:10px}
.hdr h1{font-size:32px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:24px 0 10px;gap:10px}
.sec .ln{flex:1;height:1px;background:var(--ln)}
.seg{display:flex;gap:3px;margin-top:10px}.seg i{flex:1;height:12px;background:var(--s3)}.seg i.on{background:var(--or)}
.err{color:var(--rd);font-size:13px;margin-top:10px;min-height:18px;font-weight:600}
.fl2{font-size:12px;color:var(--mu);margin-top:12px;line-height:1.5}
.inp{width:100%;height:56px;border:1.5px solid var(--ln2);background:var(--s1);border-radius:10px;padding:0 16px;color:var(--tx);font:600 18px Archivo;outline:none;margin-top:10px}
.inp:focus{border-color:var(--or)}
textarea.inp{height:140px;padding:12px;font:500 12px 'JetBrains Mono'}
.row2{display:flex;gap:8px}.row2>*{flex:1;min-width:0}
.lbl{display:block;margin-top:16px}
.pills{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.pill{border:1.5px solid var(--ln2);border-radius:8px;padding:9px 12px;font-weight:600;font-size:14px;background:var(--s1)}
.pill.sel{background:var(--tx);color:#111;border-color:var(--tx)}
.pill.lock{opacity:.55}
.dw{display:flex;gap:5px;margin-top:8px}.dw button{flex:1;height:40px;border:1.5px solid var(--ln2);border-radius:7px;background:var(--s1);font-weight:700;font-size:12.5px}
.dw button.sel{background:var(--or);border-color:var(--or);color:#140a03}
.tg{width:48px;height:28px;border-radius:20px;background:var(--ln2);position:relative;flex:none;transition:.2s;border:0}
.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--or)}.tg.on::after{left:23px}
.set{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--ln)}
.set:last-child{border-bottom:0}
.set small{color:var(--mu);display:block;font-size:12.5px;margin-top:3px;line-height:1.35}
.set .v{color:var(--or);font-family:'JetBrains Mono';font-size:13px;font-weight:700;white-space:nowrap}
.tline{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--ln);font-size:14px}.tline:last-child{border:0}.tline b{font-family:'JetBrains Mono';font-size:13px;color:var(--or)}
.pro{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(90deg,#c9963a,#ecc675);color:#1a1205;font-family:'JetBrains Mono';font-weight:700;font-size:9px;letter-spacing:.1em;padding:2px 6px;border-radius:4px;vertical-align:middle}
.flag{display:inline-block;width:18px;height:12px;vertical-align:middle;margin-left:6px;border-radius:2px}

/* onboarding */
.logo{display:flex;align-items:center;gap:12px;margin-top:6vh}
.logo .n{position:relative;font-size:clamp(110px,36vw,150px);color:var(--or)}
.logo .n span{position:absolute;left:7px;top:7px;color:transparent;-webkit-text-stroke:1.5px var(--or2);z-index:-1}
.logo .v{border-left:3px solid var(--or);padding-left:10px;font-size:clamp(34px,11vw,46px);line-height:.95;color:var(--or)}
.bars{display:flex;flex-direction:column;gap:6px;margin-left:auto;align-self:flex-start;margin-top:22px}.bars i{display:block;width:70px;height:14px;background:var(--or)}.bars i:nth-child(2){background:var(--or2)}.bars i:nth-child(3){background:var(--or3);filter:brightness(1.8)}
.hero{font-size:clamp(48px,16vw,64px);margin-top:24px}
.lead{color:var(--mu);font-size:15px;line-height:1.55;margin-top:14px}
.prog{display:flex;gap:5px;margin-bottom:26px}.prog i{flex:1;height:3px;background:var(--ln)}.prog i.on{background:var(--or)}
.q{font-size:clamp(38px,12vw,46px);margin:8px 0 6px}
.opt{display:flex;align-items:center;gap:14px;border:1.5px solid var(--ln);border-radius:10px;padding:14px;margin-top:9px;background:var(--s1)}
.opt.sel{border-color:var(--or);background:var(--or3)}
.opt .ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--s3);flex:none}
.opt b{display:block;font-size:16px}.opt small{color:var(--mu);font-size:13px;line-height:1.35}
.opt .rad{margin-left:auto;width:20px;height:20px;border:1.5px solid var(--ln2);border-radius:4px;display:grid;place-items:center;flex:none}
.opt.sel .rad{background:var(--or);border-color:var(--or);color:#140a03}
.scan div{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--ln);font-size:15px;opacity:.25;transition:.3s}.scan div.on{opacity:1}.scan div b{color:var(--gn);font-family:'JetBrains Mono';font-size:12px}
.lang{position:absolute;right:20px;top:calc(18px + var(--safe-t));display:flex;border:1.5px solid var(--ln2);border-radius:7px;overflow:hidden}
.lang button{border:0;background:none;padding:6px 10px;font-family:'JetBrains Mono';font-size:11px;font-weight:700;color:var(--mu)}.lang button.on{background:var(--tx);color:#111}

/* today */
.top{display:flex;gap:7px;align-items:center}
.top .hi{flex:1;min-width:0}.top .hi b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;font-stretch:125%;font-size:13px;color:#fff;border:2px solid #0a0908}
.dayhero{position:relative;border:1.5px solid var(--ln2);border-radius:14px;overflow:hidden;margin-top:14px;padding:16px}
.dayhero>svg.art{position:absolute;inset:0;width:100%;height:100%}
.dayhero>*:not(svg){position:relative}
.dh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dh>div:first-child{flex:1;min-width:0}.dh h1{font-size:clamp(32px,10vw,50px);line-height:.85;white-space:nowrap}.dh h1 small{font-size:18px;color:var(--mu)}.ring{width:70px;height:70px}.ring svg{width:70px;height:70px}
.ring{position:relative;width:76px;height:76px;flex:none}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-stretch:125%;font-weight:800;font-size:17px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:16px}
.week div{text-align:center}.week span{display:block;font-family:'JetBrains Mono';font-size:9.5px;color:var(--mu);letter-spacing:.06em;margin-bottom:5px}
.week i{display:grid;place-items:center;height:30px;border-radius:6px;background:#0a0908aa;border:1.5px solid var(--ln);font-style:normal;font-size:12px;font-weight:700;color:var(--mu)}
.week i.ok{background:var(--or);border-color:var(--or);color:#140a03}.week i.part{border-color:var(--or);color:var(--or)}.week i.miss{border-color:#ff646488;color:var(--rd)}.week i.frz{border-color:#6aa6ff;color:#6aa6ff}.week i.now{border-color:var(--tx);color:var(--tx);box-shadow:0 0 0 2px #f1ebe233}
.next{position:relative;height:150px;border:1.5px solid var(--ln2);border-radius:12px;overflow:hidden;margin-top:12px;box-shadow:0 3px 0 #000}
.next>svg.art{position:absolute;inset:0;width:100%;height:100%}
.next .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,9,8,.1),rgba(10,9,8,.78))}
.next .in{position:relative;height:100%;padding:13px 15px;display:flex;flex-direction:column}
.next h3{font-size:clamp(22px,7vw,27px);margin-top:auto;line-height:1.05;max-width:76%}
.tchip{align-self:flex-start;display:flex;gap:6px;align-items:center;background:var(--tx);color:#111;border-radius:20px;padding:4px 10px;font-family:'JetBrains Mono';font-weight:700;font-size:11px}
.tchip i{width:7px;height:7px;background:var(--or);display:block}
.meta{display:flex;gap:8px;align-items:center;font-size:12.5px;color:#d8d0c5;margin-top:6px;font-weight:600;flex-wrap:wrap}
.meta svg{width:13px;height:13px}.meta i{width:1px;height:12px;background:#ffffff40}
.ck{position:absolute;right:13px;bottom:13px;width:48px;height:48px;border:0;border-radius:4px;background:#e7e0d4;color:#1d1a17;display:grid;place-items:center;box-shadow:2px 2px 0 #000}
.ck svg{width:22px;height:22px;stroke-width:2.4;opacity:.45}
.pbar{position:absolute;left:0;bottom:0;height:3px;background:var(--or)}
.grp{margin-top:18px}
.gh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.qr{display:flex;align-items:center;gap:12px;padding:11px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--s1);margin-top:7px;position:relative;overflow:hidden;transition:transform .25s}
.qr .tm{font-family:'JetBrains Mono';font-size:12px;color:var(--mu);width:42px;flex:none}
.qr .cb{width:4px;align-self:stretch;border-radius:3px;flex:none}
.qr .tx{flex:1;min-width:0}.qr .tx b{display:block;font-size:15px;font-weight:700;line-height:1.25}.qr .tx small{display:flex;gap:6px;align-items:center;color:var(--mu);font-size:12px;margin-top:3px;flex-wrap:wrap}
.qr .st{color:var(--or);font-weight:800;display:inline-flex;align-items:center;gap:2px}
.qr .c2{width:36px;height:36px;border-radius:4px;border:1.5px solid var(--ln2);background:var(--s2);display:grid;place-items:center;flex:none}
.qr .c2 svg{opacity:.35;stroke-width:2.6}
.qr.done{opacity:.55}.qr.done .tx b{text-decoration:line-through}.qr.done .c2{background:var(--or);border-color:var(--or);color:#140a03}.qr.done .c2 svg{opacity:1}
.qr.skip{opacity:.4}
.qr .pb{position:absolute;left:0;bottom:0;height:2px;background:var(--or)}
.qr.pop{transform:scale(1.02) rotate(-1deg)}
.empty{text-align:center;padding:30px 10px;color:var(--mu);border:1.5px dashed var(--ln2);border-radius:12px;margin-top:12px}
.empty b{display:block;color:var(--tx);font-size:20px;margin-bottom:6px}
.closeday{margin-top:18px;width:100%;background:none;border:1.5px dashed var(--ln2);border-radius:8px;height:48px;color:var(--mu)}

/* insight */
.peak{border:1.5px solid var(--ln2);border-radius:8px;padding:7px 11px;text-align:left}
.peak b{font-size:20px}.peak small{font-family:'JetBrains Mono';font-size:11px;color:var(--mu)}
.peak .bar{height:3px;background:var(--ln);margin-top:5px}.peak .bar i{display:block;height:100%;background:var(--gn)}
.klass{position:relative;border:1.5px solid var(--ln2);border-radius:14px;overflow:hidden;padding:18px}
.klass>svg.art{position:absolute;inset:0;width:100%;height:100%}
.klass>*:not(svg){position:relative}
.klass h2{font-size:clamp(44px,14vw,54px);margin-top:12px}
.klass p{color:#d8d0c5;margin-top:6px;font-size:15px}
.tag{border:1.5px solid #ffffff30;border-radius:20px;padding:4px 10px;font-family:'JetBrains Mono';font-size:10.5px;letter-spacing:.08em;background:#0007}
.cls{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.cls div{border:1.5px solid #ffffff22;border-radius:8px;background:#0a0908b8;padding:9px 5px;min-width:0}
.cls div.top1{border-color:#ffffffaa;background:#ffffff1c}
.cls b{display:block;font-size:clamp(17px,5.5vw,22px);margin-top:6px}.cls span{font-family:'JetBrains Mono';font-size:8.5px;letter-spacing:.03em;color:var(--mu);text-transform:uppercase;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cls svg{width:15px;height:15px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{border:1.5px solid var(--ln);border-radius:12px;background:var(--s1);padding:14px;position:relative;min-width:0}
.tile .big{font-size:38px;margin-top:6px}
.ba{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ba .tile{padding:11px}.ba .h{display:flex;gap:7px;align-items:center;font-size:12px;font-weight:700;line-height:1.15}
.ba .h span{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--s3);flex:none}
.ba .v{font-family:'JetBrains Mono';margin-top:10px;font-size:11px;color:var(--mu)}
.ba .n{font-size:clamp(17px,5.5vw,22px);margin-top:4px;white-space:nowrap}
.lvcard{border:1.5px solid var(--ln2);border-radius:12px;padding:0 16px 14px;margin-top:16px;position:relative;background:var(--s1)}
.lvbox{position:absolute;left:-2px;top:-2px;width:108px;height:100px;background:var(--or);border-radius:10px 4px 22px 4px;padding:12px 14px;color:#fff}
.lvbox b{font-size:44px;display:block;line-height:.9}.lvbox span{font-family:'JetBrains Mono';font-size:11px;letter-spacing:.2em}
.lvtop{text-align:right;padding:18px 0 0 116px;min-height:100px}.lvtop b{font-size:32px}
.rt{display:flex;gap:7px;margin-top:4px;flex-wrap:wrap}
.rt button{height:34px;padding:0 12px;border:0;border-radius:7px;background:var(--s2);font-weight:600;font-size:13px;color:var(--mu)}
.rt button.on{background:var(--tx);color:#111}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln)}
.srow .m{font-size:11.5px;color:var(--tx);letter-spacing:.18em}
.srow .dl{margin-left:auto;color:var(--gn);font-size:11px}
.srow b{font-size:38px;min-width:84px;text-align:right}
.heat{display:grid;grid-template-columns:repeat(11,1fr);gap:4px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--s3)}
.cbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}.cbar span{width:74px;flex:none}.cbar div{flex:1;height:8px;background:var(--s3);border-radius:4px;overflow:hidden}.cbar div i{display:block;height:100%}.cbar b{width:40px;text-align:right;font-family:'JetBrains Mono';font-size:12px}
.lockwrap{position:relative}.lockwrap .blur{filter:blur(6px);opacity:.5;pointer-events:none}
.lockwrap .ov2{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.coach{border:1.5px solid var(--or2);background:linear-gradient(135deg,var(--or3),#14100d);border-radius:12px;padding:16px;margin-top:12px}
.coach p{margin-top:8px;line-height:1.5;color:#e4dccf;font-size:14.5px}

/* workout */
.sess{border:1.5px solid var(--ln2);border-radius:12px;overflow:hidden;background:var(--s1)}
.sess .img{position:relative;height:140px;border-bottom:2px solid var(--or)}
.sess .img>svg.art{position:absolute;inset:0;width:100%;height:100%}
.sess .img .t{position:absolute;left:16px;bottom:12px;font-size:34px}
.sess .img .c1{position:absolute;left:14px;top:14px}
.sess .img .c2{position:absolute;right:14px;top:14px;background:#e7e0d4;color:#111;padding:5px 9px;font-family:'JetBrains Mono';font-weight:700;font-size:11px;letter-spacing:.06em}
.sess .body{padding:14px}
.st3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.st3 div{border:1.5px solid var(--ln2);padding:9px 11px;min-width:0}.st3 b{font-size:19px;display:block;margin-top:3px;white-space:nowrap}
.moves{display:flex;flex-wrap:wrap;gap:6px;border-top:1.5px dashed var(--ln2);margin-top:16px;padding-top:14px}
.moves span{border:1.5px solid var(--ln2);padding:6px 9px;font-size:13px}.moves span em{color:var(--or);font-style:normal;margin-right:5px;font-weight:700}
.qs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qs button{border:1.5px solid var(--ln2);border-radius:10px;background:var(--s1);padding:13px 0 10px;font-weight:700;font-size:13.5px}
.qs button.on{border-color:var(--or)}
.qs .sw{width:34px;height:34px;margin:0 auto 8px;border-radius:4px;display:grid;place-items:center}
.rec{display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--ln2);border-radius:10px;padding:13px 14px;margin-top:8px}
.rec b{font-size:16px}.rec small{display:block;color:var(--mu);font-size:12.5px;margin-top:3px}
.rec .kg{border:1.5px solid var(--ln2);padding:5px 8px;font-weight:800;font-size:14px}
.live{text-align:center}.live .clock{font-size:80px;color:var(--or)}
.mv{border:1.5px solid var(--ln);border-radius:10px;padding:13px;margin-top:8px}
.mv .h{display:flex;justify-content:space-between;font-weight:700}
.sets{display:flex;gap:6px;margin-top:10px}.sets button{flex:1;height:36px;border:1.5px solid var(--ln2);background:var(--s2);border-radius:5px;font-family:'JetBrains Mono';font-size:12px;font-weight:700}
.sets button.on{background:var(--or);border-color:var(--or);color:#140a03}

/* season */
.lg{border:2px solid var(--gd);border-radius:6px;background:linear-gradient(180deg,#1d1810,#121110)}
.lg .a{display:flex;gap:14px;align-items:center;padding:16px;border-bottom:1.5px dashed #3a3222}
.lg .a h2{font-size:28px}
.lg .b{padding:14px 16px 16px}
.lg .seg i{height:14px}.lg .seg i.on{background:linear-gradient(90deg,#c9963a,#ecc675)}
.rw{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rw>div{border:1.5px solid #3a3222;padding:12px;display:flex;gap:10px;align-items:center;min-width:0}
.rw b{font-size:13.5px;display:block}.rw small{color:var(--mu);font-size:11.5px}
.rw .pb2{height:5px;background:var(--s3);margin-top:6px}.rw .pb2 i{display:block;height:100%;background:var(--gd)}
.chart{border:1.5px solid var(--ln);border-radius:12px;padding:14px;margin-top:14px;background:var(--s1)}
.lb{border:1.5px solid var(--ln);border-radius:12px;margin-top:14px;overflow:hidden;background:var(--s1)}
.lb .h{display:flex;justify-content:space-between;padding:14px 16px}
.lr{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--ln)}
.lr .rk{width:22px;color:var(--gn);font-weight:800}
.lr .nm{min-width:0}.lr .nm b{font-size:15.5px}.lr .nm small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.lr .fl{color:var(--or);font-size:12px;font-weight:700;margin-left:6px}
.lr .xp{margin-left:auto;text-align:right;font-weight:800;font-size:16px}.lr .xp small{display:block;color:var(--gn);font-size:11px;font-weight:600}
.lr.me{background:linear-gradient(90deg,#d6a443,#c99637);color:#1a1205;border-radius:10px;margin:8px;border:0}
.lr.me .rk,.lr.me .xp small,.lr.me .nm small{color:#3a2a0a}

/* profile */
.fs{border:1.5px solid var(--or2);border-radius:12px;background:linear-gradient(135deg,var(--or3),#14100d);padding:16px}
.fs .r{display:flex;align-items:center;gap:12px;margin-top:10px}
.nudge{margin-left:auto;height:42px;padding:0 13px;border:1.5px solid var(--or);border-radius:8px;background:transparent;color:var(--or);font-family:'JetBrains Mono';font-weight:700;letter-spacing:.1em;font-size:11.5px;flex:none}
.pc{border:1.5px solid var(--ln2);border-radius:12px;padding:22px 16px;text-align:center;margin-top:12px;background:radial-gradient(circle at 50% 0,#2a241c,var(--s1) 70%)}
.pc .av{width:90px;height:90px;font-size:28px;margin:0 auto;border:3px solid #e7e0d4}
.pc h2{font-size:28px;margin-top:12px}
.bdg{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.bdg span{border-radius:20px;padding:6px 12px;font-family:'JetBrains Mono';font-weight:700;font-size:11px;letter-spacing:.1em}
.g4{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ln2);border-radius:12px;margin-top:12px;overflow:hidden}
.g4 div{padding:14px;border-right:1.5px solid var(--ln2);border-bottom:1.5px solid var(--ln2);min-width:0}
.g4 div:nth-child(2n){border-right:0}.g4 div:nth-child(n+3){border-bottom:0}
.g4 b{font-size:24px;display:flex;align-items:center;gap:4px;margin-top:4px}
.act{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--ln)}
.act .dy{border:1.5px solid var(--ln2);width:48px;text-align:center;padding:5px 0;flex:none}
.act .dy b{display:block;font-size:19px}
.act .xb{margin-left:auto;text-align:right;flex:none}.act .xb span{border:1.5px solid var(--ln2);padding:3px 7px;font-weight:800;font-size:12px}
.act .xb small{display:block;color:var(--mu);margin-top:5px;font-size:12px}
.sw5{display:flex;gap:10px;margin-top:10px}.sw5 button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;position:relative}.sw5 button.on{border-color:var(--tx)}
.sw5 button svg{position:absolute;right:-4px;bottom:-4px;width:14px;height:14px;background:var(--s1);border-radius:50%;padding:2px}

/* plan */
.prg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.prg button{text-align:left;border:1.5px solid var(--ln2);border-radius:10px;background:var(--s1);padding:12px;min-height:92px;display:flex;flex-direction:column;gap:4px}
.prg button.on{border-color:var(--or);background:var(--or3)}
.prg b{font-size:15px}.prg small{color:var(--mu);font-size:12px;line-height:1.3}
.pl{display:flex;align-items:center;gap:12px;padding:12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--s1);margin-top:7px}
.pl .tx{flex:1;min-width:0}.pl b{display:block;font-size:15px}.pl small{color:var(--mu);font-size:12px}
.pl.off{opacity:.45}

/* paywall */
.pw h2{font-size:40px;margin-top:6px}
.feat{display:flex;gap:12px;align-items:flex-start;padding:10px 0}
.feat span{width:30px;height:30px;border-radius:7px;background:var(--or3);color:var(--or);display:grid;place-items:center;flex:none}
.feat b{display:block;font-size:15px}.feat small{color:var(--mu);font-size:12.5px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.plans button{border:1.5px solid var(--ln2);border-radius:12px;background:var(--s1);padding:14px 12px;text-align:left;position:relative}
.plans button.on{border-color:var(--or);background:var(--or3)}
.plans b{display:block;font-size:20px;margin-top:6px}.plans small{color:var(--mu);font-size:12px}
.plans em{position:absolute;top:-9px;right:10px;background:var(--gn);color:#08130c;font-style:normal;font-family:'JetBrains Mono';font-weight:700;font-size:9.5px;padding:3px 6px;border-radius:4px;letter-spacing:.06em}

/* nav, sheet, toast */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;display:none;background:rgba(10,9,8,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--ln);padding:8px 6px calc(8px + var(--safe-b));z-index:5}
.nav.on{display:flex}
.nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:4px 0;color:var(--mu2)}
.nav button span{font-family:'JetBrains Mono';font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--or)}
.ov{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:10}
.ov.on{display:flex}
.sh{width:100%;max-width:440px;max-height:92vh;overflow-y:auto;background:var(--s1);border-top:1.5px solid var(--ln2);border-radius:18px 18px 0 0;padding:10px 18px calc(22px + var(--safe-b));animation:su .25s ease}
@keyframes su{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sh .grab{width:40px;height:4px;background:var(--ln2);border-radius:4px;margin:0 auto 14px}
.sh h2{font-size:30px;margin-top:6px}
.stp{display:flex;align-items:center;justify-content:space-between;margin-top:20px}
.stp .val{font-size:50px;text-align:center}.stp .val small{font-size:18px;color:var(--mu)}
.stp .bx{width:54px;height:54px;font-size:26px;font-weight:700}
.barb{height:6px;background:var(--s3);margin-top:16px}.barb i{display:block;height:100%;background:var(--or);transition:.3s}
.toast{position:fixed;left:50%;top:calc(14px + var(--safe-t));transform:translate(-50%,-160%);transition:.35s;background:var(--tx);color:#111;font-weight:700;padding:12px 16px;border-radius:8px;z-index:20;box-shadow:3px 3px 0 #000;font-size:14px;max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.fxp{position:fixed;font-weight:900;font-stretch:125%;color:var(--or);pointer-events:none;z-index:20;animation:fx 1s forwards;font-size:18px}
@keyframes fx{to{transform:translateY(-60px);opacity:0}}
</style>

const NATIVE=typeof window.AzimNative!=='undefined';
const WEB=!NATIVE&&/\.github\.io$/.test(location.hostname);
const PREVIEW=!NATIVE&&!WEB;
const Store={
 get(k){try{return NATIVE?AzimNative.get(k):localStorage.getItem(k)}catch(e){return null}},

 del(k){try{NATIVE?AzimNative.remove(k):localStorage.removeItem(k)}catch(e){}},
 json(k){try{return JSON.parse(this.get(k)||'null')}catch(e){return null}}
};
let LANG=Store.get('azim.lang')||((navigator.language||'tr').toLowerCase().startsWith('tr')?'tr':'en');
const LI=()=>LANG==='en'?1:0;

function mkQuest(id){const b=LIB[id];return {id,lib:id,c:b.c,n:b.n,u:b.u,s:b.s,days:b.days.slice(),d:b.d,time:b.time,remind:true,on:true}}
function phase(d){return d<=22?0:d<=44?1:2}
function dowOf(day){return (dowOfDate(S.start)+day-1)%7}
function qN(q,day){if(q.custom||!q.u)return q.n;const k=(LIB[q.lib]&&LIB[q.lib].k)||[1,1.5,2];const m=k[phase(day)];return Math.max(q.s,Math.round(q.n*m/q.s)*q.s)}
function qTime(q){return q.time==='wake'?S.sched.wake:q.time==='sleep'?S.sched.sleep:q.time||''}
function qTitle(q,day){if(q.custom)return q.text;const n=qN(q,day||S.day);return t(q.tk||LIB[q.lib].tk).replace('{n}',num(fmtSmall(n))).replace('{w}',S.sched.wake).replace('{s}',S.sched.sleep)}
function fmtSmall(n){return n>=1000?fmtN(n):+n.toFixed(2)}
function todayQuests(day){day=day||S.day;const dw=dowOf(day);return S.quests.filter(q=>q.on&&q.days.includes(dw)).map(q=>({...q,N:qN(q,day),title:qTitle(q,day),tm:qTime(q)})).sort((a,b)=>(toMin(a.tm)??9999)-(toMin(b.tm)??9999))}
const isDone=q=>(S.prog[q.id]||0)>=q.N;
function lvl(xp){let l=1,r=xp,need=400;while(r>=need){r-=need;l++;need=400+l*60}return{l,r,need}}
function league(xp){const T=t('tiers'),D=['III','II','I'],step=600,k=Math.min(14,Math.floor(xp/step));return{t:T[Math.floor(k/3)],d:D[k%3],into:xp-k*step,step,next:k<14?(k%3===2?T[Math.floor(k/3)+1]+' III':T[Math.floor(k/3)]+' '+D[k%3+1]):'—'}}
function topStat(){return CK.reduce((a,b)=>S.stats[b]>S.stats[a]?b:a)}
function addXp(n,ev){const before=lvl(S.xp).l;S.xp=Math.max(0,S.xp+n);
 if(ev&&n>0&&ev.clientX){const f=document.createElement('div');f.className='fxp';f.textContent='+'+n+' XP';f.style.left=(ev.clientX-30)+'px';f.style.top=(ev.clientY-30)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1000)}
 const a=lvl(S.xp).l;if(a>before)setTimeout(()=>toast(t('levelup',a)),300)}

function complete(id,ev,quiet){
 const q=todayQuests().find(x=>x.id===id);if(!q)return;
 if(isDone(q)){S.prog[id]=0;addXp(-XPD[q.d]);S.stats[q.c]-=STD[q.d];S.tasks--;S.log=S.log.filter(l=>!(l.day===S.day&&l.id===id));save();if(!quiet)render();return}
 S.prog[id]=q.N;S.skip=S.skip.filter(x=>x!==id);addXp(XPD[q.d],ev);S.stats[q.c]+=STD[q.d];S.tasks++;
 S.log.unshift({day:S.day,id,t:q.title,xp:XPD[q.d],st:(S.qs[id]||0)+1});S.log=S.log.slice(0,40);
 try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
 save();if(quiet)return;
 const el=document.querySelector(`[data-q="${id}"]`);if(el){el.classList.add('pop','done');setTimeout(render,380)}else render();

/* ---------- DAY ROLLOVER / STREAK ---------- */
function dayResult(){const Q=todayQuests(),d=Q.filter(isDone).length,r=Q.length?d/Q.length:1;
 const okDay=r===1, kept=okDay||(!S.hard&&r>=.5);return{Q,d,all:Q.length,r,okDay,kept}}
function missOutcome(){// what happens on a non-kept day
 if(S.hard)return'reset';if((S.freezes||0)>0)return'frz';const prev=S.hist[S.day-2];if(prev&&(prev.res==='miss'||prev.res==='grace'))return'reset';return'grace'}
function closeDay(auto){
 if(S.day>66)return null;const x=dayResult();let res;
 if(x.okDay){res='ok';S.streak=(S.streak||0)+1;addXp(40+S.streak*5)}
 else if(x.kept){res='part';S.streak=(S.streak||0)+1}
 else{const o=missOutcome();
  if(o==='frz'){res='frz';S.freezes--}
  else if(o==='grace'){res='grace'}
  else{res='miss';S.streak=0;if(S.hard)addXp(-100)}}
 x.Q.forEach(q=>S.qs[q.id]=isDone(q)?(S.qs[q.id]||0)+1:(res==='frz'?(S.qs[q.id]||0):0));
 S.best=Math.max(S.best||0,S.streak||0);
 S.hist[S.day-1]={done:x.d,total:x.all,res,xp:S.xp,items:x.Q.filter(isDone).map(q=>q.title),cats:x.Q.map(q=>[q.c,isDone(q)?1:0])};
 S.day++;S.prog={};S.skip=[];
 if(S.day<=66&&dowOf(S.day)===1)S.freezes=Math.min(freezeCap(),(S.freezes||0)+1);
 const out={day:S.day-1,res,done:x.d,total:x.all};
 if(auto)return out;
 save();closeSheet();render();scrollTo(0,0);
 const ph={23:t('ph2'),45:t('ph3')}[S.day];
 toast(S.day>66?t('finished66'):ph?t('new_phase',ph):t('day_started',S.day));return out;
}
function rollover(){
 if(!S||!S.quests)return;const td=ymd();let n=0,first=null;
 while(S.date<td&&n<80){const r=closeDay(true);if(!first&&r)first=r;S.date=addDay(S.date);n++}
 if(n){save();if(first)setTimeout(()=>rolledSheet(first,n),350)}
}
function resName(r){return {ok:t('perfect'),part:t('partial'),miss:t('missed'),frz:t('frozen'),grace:t('grace')}[r]}
function rolledSheet(r,n){openSheet(`<div class="m">${t('rolled',r.day)}</div><h2 class="w">${resName(r.res)}</h2><p style="color:#d8d0c5;margin-top:10px;line-height:1.5">${t('rolled_d',r.done,r.total)}${n>1?t('rolled_more',n-1):''}${t('rolled_streak',S.streak||0)}</p><button class="cta" onclick="closeSheet();maybePaywall()">${t('keep_going')}</button>`)}

async function hashPw(pw,salt){const data=new TextEncoder().encode(salt+':'+pw);
 try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}}catch(e){}
 let h=2166136261;for(const c of data){h^=c;h=Math.imul(h,16777619)>>>0}return 'f'+h.toString(16)}
function rnd(){const a=new Uint8Array(12);try{crypto.getRandomValues(a)}catch(e){for(let i=0;i<12;i++)a[i]=Math.random()*256|0}return [...a].map(x=>x.toString(16).padStart(2,'0')).join('')}
const mailOk=m=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m);
async function register(){const n=val('rName'),m=val('rMail').toLowerCase(),p=$('rPass').value,e=$('rErr');
 if(n.length<2)return e.textContent=t('e_name');if(!mailOk(m))return e.textContent=t('e_mail');if(p.length<6)return e.textContent=t('e_pass');
 const acc=Store.json('azim.accounts')||{};if(acc[m])return e.textContent=t('e_exists');
 const salt=rnd();acc[m]={name:n,salt,hash:await hashPw(p,salt),created:Date.now()};Store.set('azim.accounts',JSON.stringify(acc));
 USER=m;Store.set('azim.session',m);F={name:n,areas:[],water:null,screen:null,shift:null,hard:null};obGo('areas')}
async function login(){const m=val('lMail').toLowerCase(),p=$('lPass').value,e=$('lErr');const a=(Store.json('azim.accounts')||{})[m];

function weekStrip(){const curDow=dowOf(Math.min(S.day,66)),mon=S.day-((curDow+6)%7);const names=t('dow');
 return `<div class="week">${[0,1,2,3,4,5,6].map(i=>{const d=mon+i,dw=(i+1)%7,h=d>=1&&d<S.day?S.hist[d-1]:null;
  const cls=d===S.day?'now':h?({ok:'ok',part:'part',miss:'miss',frz:'frz',grace:'miss'}[h.res]):'';
  return `<div><span>${names[dw]}</span><i class="${cls}">${h&&h.res==='frz'?ic('i-snow','width:13px;height:13px'):d>=1&&d<=66?d:'·'}</i></div>`}).join('')}</div>`}

 const sub=S.day>66?t('sub_end'):r===1?t('sub_done'):r>=.5?t('sub_half'):S.day===1?t('sub_first'):t(['sub_a','sub_b','sub_c'][S.day%3]);

 let h=`<div class="top">${avatar(S.name,'var(--or)')}<div class="hi"><span class="m">${new Date().toLocaleDateString(LANG==='tr'?'tr-TR':'en-US',{weekday:'long',day:'numeric',month:'long'})}</span><b class="w">${esc(t('hello',S.name))}</b></div>
 <span class="chip hot">${ic('i-flame','fill:var(--or);stroke:none;width:15px;height:15px')}${S.streak||0}</span><span class="chip" onclick="freezeInfo()" style="color:#6aa6ff">${ic('i-snow','width:15px;height:15px')}${S.hard?0:S.freezes||0}</span></div>
 <div class="dayhero">${art('grid','#1d1a17','#0d0c0b',2)}<div class="dh"><div><div class="m or">${t('phase'+phase(Math.min(S.day,66)))} · ${fmtN(S.xp)} XP</div><h1 class="w" style="margin-top:8px">${t('day')} ${Math.min(S.day,66)} <small>/ 66</small></h1><div style="color:#cfc7bc;margin-top:8px;font-size:14px;font-weight:500">${sub}</div></div>
 <div class="ring"><svg width="76" height="76" viewBox="0 0 78 78"><circle cx="39" cy="39" r="33" stroke="#2b2723" stroke-width="7" fill="none"/><circle cx="39" cy="39" r="33" stroke="var(--or)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct/100)}" transform="rotate(-90 39 39)" style="transition:.5s"/></svg><b>${pct}%</b></div></div>${weekStrip()}</div>`;
 if(nx){const Cc=CATS[nx.c],p=S.prog[nx.id]||0;
  h+=`<div class="sec" style="margin-top:20px"><span class="m">${t('nextq')}</span><span class="ln"></span></div>

  <div class="meta">${ic(Cc.ic,'stroke:'+Cc.col)}${t('c_'+nx.c)}<i></i>${ic('i-lvl')}${t('d_'+nx.d)}<i></i>+${XPD[nx.d]} XP${S.qs[nx.id]?`<i></i>${ic('i-flame','fill:var(--or);stroke:none')}${S.qs[nx.id]}`:''}</div></div>
  <button class="ck" onclick="event.stopPropagation();complete('${nx.id}',event)">${ic('i-check')}</button>${nx.u&&p>0?`<div class="pbar" style="width:${p/nx.N*100}%"></div>`:''}</div>`}

 const groups=[['g_morning',q=>q.tm&&toMin(q.tm)<720],['g_noon',q=>q.tm&&toMin(q.tm)>=720&&toMin(q.tm)<1020],['g_eve',q=>q.tm&&toMin(q.tm)>=1020],['g_any',q=>!q.tm]];
 groups.forEach(g=>{const list=Q.filter(g[1]);if(!list.length)return;h+=`<div class="grp"><div class="gh"><span class="m">${t(g[0])}</span></div>${list.map(qRow).join('')}</div>`});
 h+=!PREVIEW?`<div class="m" style="text-align:center;margin-top:22px;font-size:9.5px">${t('closes')}</div>`:`<button class="closeday m" onclick="closeDaySheet()">${t('preview_close')} ${ic('i-arr','width:14px;height:14px;vertical-align:-2px')}</button>`;

 const pr=q.u?`${num(fmtSmall(Math.min(p,q.N)))} / ${num(fmtSmall(q.N))} ${t(q.u)}`:t('d_'+q.d);
 return `<div class="qr ${dn?'done':''} ${sk?'skip':''}" data-q="${q.id}" onclick="qSheet('${q.id}')"><span class="tm">${q.tm||'—'}</span><span class="cb" style="background:${C.col}"></span>

 openSheet(`<div class="m" style="color:${C.col}">${t('c_'+q.c)} · ${q.tm||t('anytime')} · ${t('d_'+q.d)} · +${XPD[q.d]} XP</div><h2 class="w">${esc(q.title)}</h2>
 ${q.u?`<div class="stp"><button class="bx" onclick="stepQ('${id}',-1)">−</button><div class="val w" id="sv"></div><button class="bx" onclick="stepQ('${id}',1)">+</button></div><div class="barb"><i id="sb"></i></div>`:`<p class="mu" style="margin-top:12px;line-height:1.5">${t('single_step')}</p>`}

 if(q.u)updStep(q,p)}
function updStep(q,p){$('sv').innerHTML=`${num(fmtSmall(p))}<small> / ${num(fmtSmall(q.N))} ${t(q.u)}</small>`;$('sb').style.width=Math.min(100,p/q.N*100)+'%'}
function stepQ(id,d){const q=todayQuests().find(x=>x.id===id);const was=isDone(q);const p=Math.max(0,Math.min(q.N,+((S.prog[id]||0)+d*q.s).toFixed(2)));
 if(p>=q.N&&!was){S.prog[id]=0;closeSheet();complete(id);return}

function clock(){const s=Math.floor((Date.now()-live.t0)/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function rLive(){const w=WT[live.k],n=live.done.flat().filter(Boolean).length,tt=live.done.flat().length;
 $('scr').innerHTML=`<div class="hdr"><h1 class="w">${t('workout')}</h1></div><div class="panel live"><div class="m">${t('in_progress',t(w.tk))}</div><div class="clock d" id="clk">${clock()}</div><div class="m">${t('sets_done',n,tt)}</div><div class="barb"><i style="width:${n/tt*100}%"></i></div></div>
 ${w.mv.map((m,i)=>`<div class="mv"><div class="h"><span>${i+1}. ${mvName(m[0])}</span><span class="m">${m[1]}×${m[2]}</span></div><div class="sets">${live.done[i].map((d,j)=>`<button class="${d?'on':''}" onclick="live.done[${i}][${j}]=!live.done[${i}][${j}];render()">${j+1}</button>`).join('')}</div></div>`).join('')}
 <button class="cta" onclick="endW()">${t('finish_w')}</button><button class="cta ghost sm" onclick="live=null;clearInterval(timer);render()">${t('cancel')}</button>`}
function endW(){const n=live.done.flat().filter(Boolean).length;if(!n)return toast(t('one_set'));const min=Math.max(1,Math.round((Date.now()-live.t0)/60000));
 S.workouts.unshift({tk:WT[live.k].tk,day:S.day,sets:n,min,kg:n*385});S.stats.str+=4;addXp(15*n);S.log.unshift({day:S.day,id:'w',t:t(WT[live.k].tk),xp:15*n,st:0});
 live=null;clearInterval(timer);save();render();toast(t('w_saved',15*n))}

/* ---------- SEASON ---------- */
function rSeason(){
 const now=new Date(),end=new Date(now.getFullYear(),now.getMonth()+1,1),ms=end-now,L1=league(S.xp);
 const mon=up(now.toLocaleDateString(LANG==='tr'?'tr-TR':'en-US',{month:'long',year:'numeric'})),segOn=Math.round(L1.into/L1.step*5);
 const daily=S.hist.map((x,i)=>x.xp-(i?S.hist[i-1].xp:0));const todayX=S.xp-(S.hist.length?S.hist[S.hist.length-1].xp:0);daily.push(todayX);
 const avg=Math.round(daily.reduce((a,b)=>a+Math.max(0,b),0)/daily.length)||0,AVG=Math.max(60,Math.round(avg*.9)+20);
 const N=24,sh=daily.slice(-N),mx=Math.max(AVG*1.6,...sh,1);
 const bars=Array.from({length:N},(_,i)=>{const v=sh[i];return v==null?`<rect x="${i*12+2}" y="58" width="8" height="2" fill="#2b2723"/>`:`<rect x="${i*12+2}" y="${60-Math.max(2,v/mx*56)}" width="8" height="${Math.max(2,v/mx*56)}" fill="#c99637"/>`}).join('');
 const base=Math.max(S.xp,900);const rows=PLAYERS.map((p,i)=>({n:p[0],g:p[1],c:p[2],x:Math.round(base*1.25-i*base*.045+(i%3)*7),td:[110,60,80,40,110,30,50,20,90,40][i],f:[8,15,4,11,18,6,9,3,13,5][i]}));
 rows.push({me:1,x:S.xp});rows.sort((a,b)=>b.x-a.x);const myR=rows.findIndex(r=>r.me)+1+17;
 $('scr').innerHTML=`<div class="hdr"><h1 class="w">${t('season')}</h1><div style="display:flex;gap:10px;align-items:center"><div style="text-align:right"><b class="w" style="font-size:20px">${Math.floor(ms/864e5)}${LANG==='tr'?'g':'d'} ${Math.floor(ms%864e5/36e5)}${LANG==='tr'?'s':'h'}</b><div class="m">${t('closes_in')}</div></div><button class="bx" onclick="toast(t('season_info'))">${ic('i-info')}</button></div></div>
 <div class="lg"><div class="a"><svg width="60" height="60" viewBox="0 0 64 64"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3d58a"/><stop offset="1" stop-color="#9c6c22"/></linearGradient></defs><path d="M32 4l22 9v17c0 15-10 24-22 30C20 54 10 45 10 30V13z" fill="url(#gg)" stroke="#5a3f12" stroke-width="2"/><path d="M20 26l12 8 12-8M20 36l12 8 12-8" stroke="#5a3f12" stroke-width="3.5" fill="none" stroke-linejoin="round"/></svg>
 <div style="flex:1;min-width:0"><div class="m" style="color:var(--gd)">${mon}</div><h2 class="w">${L1.t} ${L1.d}</h2><div class="mu" style="font-size:13px;margin-top:3px">${t('this_season',fmtN(S.xp))}</div></div></div>
 <div class="b"><div style="display:flex;justify-content:space-between;font-size:14px;gap:8px"><span>${t('to_next',fmtN(L1.step-L1.into),L1.next)}</span><span class="m">${Math.round(L1.into/L1.step*100)}%</span></div>
 <div class="seg">${Array.from({length:5},(_,i)=>`<i class="${i<segOn?'on':''}"></i>`).join('')}</div>
 <div class="rw"><div><svg width="30" height="30" viewBox="0 0 34 34" style="flex:none"><circle cx="17" cy="17" r="13" fill="none" stroke="#d6a443" stroke-width="3" stroke-dasharray="5 3"/></svg><div style="min-width:0"><b>${t('frame')}</b><small>${t('tiers')[0]} III</small><div class="pb2"><i style="width:100%"></i></div><small style="color:var(--gd);font-family:'JetBrains Mono';font-size:9px">${t('unlocked')}</small></div></div>
 <div>${ic('i-lock','width:26px;height:26px')}<div style="min-width:0"><b>${t('wallpaper')}</b><small>5.000 XP</small><div class="pb2"><i style="width:${Math.min(100,S.xp/50)}%;background:var(--or)"></i></div><small style="font-family:'JetBrains Mono';font-size:9px">${Math.min(100,Math.round(S.xp/50))}%</small></div></div></div></div></div>
 <div class="chart"><div style="display:flex;justify-content:space-between;gap:8px"><span class="m">${t('daily_xp')}</span><span class="m"><b style="color:var(--gd)">■</b> ${Math.max(0,todayX)} <b style="color:var(--rd)">···</b> ${t('avg_of',L1.t)} ${AVG}</span></div><svg viewBox="0 0 288 62" style="width:100%;margin-top:12px">${bars}<line x1="0" x2="288" y1="${60-AVG/mx*56}" y2="${60-AVG/mx*56}" stroke="#ff6464" stroke-dasharray="2 3" stroke-width="1.5"/></svg></div>
 <div class="lb"><div class="h"><span class="m">${t('sample_lg')}</span><span class="m" style="text-align:right">XP</span></div>
 ${rows.filter(r=>!r.me).slice(0,7).map((r,i)=>`<div class="lr"><span class="rk">${i+1}</span>${avatar(r.n,r.c)}<div class="nm"><b>${r.n}</b>${TRF}<span class="fl">${ic('i-flame','fill:var(--or);stroke:none;width:11px;height:11px;vertical-align:-1px')}${r.f}</span>${r.g?`<small>${r.g[LI()]}</small>`:''}</div><div class="xp">${fmtN(r.x)}<small>(+${r.td})</small></div></div>`).join('')}
 <div class="lr me"><span class="rk">#${myR}</span>${avatar(S.name,'var(--or)')}<div class="nm"><b>${t('you2')}</b><small>${esc(S.goal)}</small></div><div class="xp">${fmtN(S.xp)}<small>(+${Math.max(0,todayX)})</small></div></div></div>`}

/* ---------- PROFILE ---------- */

 const L1=league(S.xp),since=new Date(S.since).toLocaleDateString(LANG==='tr'?'tr-TR':'en-US',{month:'short',year:'numeric'}),tq=todayQuests().filter(isDone).length,P=isPrem();
 const ver=NATIVE?(()=>{try{return AzimNative.appVersion()}catch(e){return '2.0.0'}})():'2.0.0';
 $('scr').innerHTML=`<div class="hdr"><h1 class="w" style="font-size:24px;letter-spacing:.02em">${t('profile')}</h1><button class="bx" onclick="go('today')">${ic('i-x')}</button></div>
 <div class="fs"><div class="m or">${t('together')}</div><div class="r">${ic('i-flame','fill:var(--or);stroke:none;width:28px;height:28px')}<div style="flex:1;min-width:0"><b class="w" style="font-size:18px">${t('invite')}</b><div style="color:#cdb8a6;font-size:13px;margin-top:4px">${t('invite_d')}</div></div><button class="nudge" onclick="invite()">${ic('i-hand','width:15px;height:15px;vertical-align:-3px')} ${t('invite_btn')}</button></div></div>
 <div class="pc">${avatar(S.name,'var(--or)')}<h2 class="w">${esc(S.name)}${LANG==='tr'?TRF:''}</h2>

 <div class="m" style="margin-top:18px">${t('month_goal')}</div><b class="w" style="font-size:18px;display:block;margin-top:6px" onclick="goalSheet()">${esc(S.goal)} <span class="mu" style="font-size:13px">✎</span></b></div>
 <div class="g4"><div><span class="m">${t('member')}</span><b class="w">${since}</b></div><div><span class="m">${t('cur_streak')}</span><b class="w">${S.streak||0}${ic('i-flame','fill:var(--or);stroke:none;width:18px;height:18px')}</b></div><div><span class="m">${t('today_q')}</span><b class="w">${tq}</b></div><div><span class="m">${t('season_xp')}</span><b class="w">${fmtN(S.xp)}</b></div></div>
 <div class="panel" style="${P?'':'border-color:var(--gd)'}"><div class="set" style="padding-top:0"><div><b>${t('premium')} ${P?'':'<span class="pro">PRO</span>'}</b><small>${P?t('premium_on'):t('premium_off')}</small></div><button class="cta sm" style="width:auto;margin:0;padding:0 14px" onclick="${P?'manageSub()':'paywall()'}">${P?t('manage_sub'):t('go_premium')}</button></div></div>
 <div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span class="m">${t('recent_act')}</span><span class="mu" style="font-size:12px">${t('last5')}</span></div>
 ${S.log.length?S.log.slice(0,5).map(l=>`<div class="act"><div class="dy"><span class="m" style="font-size:8.5px">${t('day')}</span><b class="w">${l.day}</b></div><div style="min-width:0"><b>${esc(l.t)}</b>${l.st?`<div class="mu" style="font-size:12px;margin-top:3px">${ic('i-flame','fill:var(--mu);stroke:none;width:11px;height:11px;vertical-align:-1px')} ${l.st}</div>`:''}</div><div class="xb"><span>+${l.xp} XP</span><small>${l.day===S.day?t('today'):l.day===S.day-1?t('yesterday'):t('days_ago',S.day-l.day)}</small></div></div>`).join(''):`<div class="mu" style="padding:12px 0">${t('no_act')}</div>`}</div>
 <div class="panel"><span class="m">${t('settings')}</span>
 <div class="set"><div><b>${t('language')}</b></div><div class="lang" style="position:static"><button class="${LANG==='tr'?'on':''}" onclick="setLang('tr')">TR</button><button class="${LANG==='en'?'on':''}" onclick="setLang('en')">EN</button></div></div>
 <div class="set"><div><b>${t('theme')}</b><div class="sw5">${Object.keys(THEMES).map(k=>`<button class="${(S.theme||'orange')===k?'on':''}" style="background:${THEMES[k][0]}" onclick="setTheme('${k}')">${THEMES[k][3]&&!P?ic('i-lock','stroke:#fff'):''}</button>`).join('')}</div></div></div>
 <div class="set"><div><b>${t('hard_mode')}</b><small>${t('hard_d')}</small></div><button class="tg ${S.hard?'on':''}" onclick="S.hard=!S.hard;if(S.hard)S.freezes=0;else S.freezes=Math.max(S.freezes||0,1);save();render();toast(S.hard?t('hard_on'):t('hard_off'))"></button></div>
 <div class="set" onclick="schedSheet()"><div><b>${t('schedule')}</b><small>${t('schedule_d')}</small></div><span class="v">${S.sched.wake} – ${S.sched.sleep}</span></div>
 ${!NATIVE?`<div class="set"><div><b>${t('reminders')}</b><small>${t('web_notif')}</small></div>${ic('i-bell','stroke:var(--mu)')}</div>`:`<div class="set"><div><b>${t('reminders')}</b><small>${t('rem_d')}</small></div><button class="tg ${remOn()?'on':''}" onclick="enableReminders(!remOn());render()"></button></div>`}
 ${NATIVE&&remOn()?`<div style="padding:2px 0 4px">${remList()}<div class="tline"><span>${t('quests')}</span><b>${S.quests.filter(q=>q.on&&q.remind&&qTime(q)).length}×</b></div></div><button class="cta ghost sm" style="margin-bottom:6px" onclick="testNotif()">${ic('i-bell','width:15px;height:15px')}${t('test_notif')}</button>`:''}
 <div class="set" onclick="go('plan')"><div><b>${t('my_plan')}</b><small>${t('p_'+S.program)} · ${S.quests.filter(q=>q.on).length} ${t('quests').toLowerCase()}</small></div>${ic('i-r')}</div></div>
 <div class="panel"><span class="m">${t('data')}</span><button class="cta ghost sm" onclick="exportSheet()">${ic('i-up','width:15px;height:15px')}${t('export')}</button><button class="cta ghost sm" onclick="importSheet()">${ic('i-down','width:15px;height:15px')}${t('import')}</button></div>
 <div class="panel"><span class="m">${t('account')}</span><div class="set"><div style="min-width:0"><b style="word-break:break-all">${esc(USER||'')}</b><small>${t('on_device')}</small></div></div>
 <button class="cta ghost sm" onclick="logout()">${t('logout')}</button><button class="cta ghost sm" style="color:var(--rd)" onclick="resetSheet()">${t('reset')}</button><button class="lnk" style="color:var(--rd)" onclick="delSheet()">${t('del_acc')}</button></div>
 <div class="m" style="text-align:center;margin-top:18px;font-size:9.5px">${t('version',ver)} · <a href="privacy.html" style="color:var(--mu)">${t('privacy')}</a></div>`}
function setTheme(k){if(THEMES[k][3]&&!isPrem())return paywall();S.theme=k;save();applyTheme();render()}
function schedSheet(){const pre=k=>`<button class="pill ${S.sched.preset===k?'sel':''}" onclick="setPreset('${k}')">${t('sh_'+k)}</button>`;
 openSheet(`<h2 class="w">${t('schedule')}</h2><p class="mu" style="margin-top:8px">${t('schedule_d')}</p><span class="m lbl">${t('preset')}</span><div class="pills">${pre('day')}${pre('early')}${pre('night')}</div>
 <div class="row2"><div><span class="m lbl">${t('wake')}</span><input class="inp" id="sW" type="time" value="${S.sched.wake}"></div><div><span class="m lbl">${t('sleep')}</span><input class="inp" id="sS" type="time" value="${S.sched.sleep}"></div></div>
 <span class="m lbl">${t('train_t')}</span><input class="inp" id="sT" type="time" value="${S.sched.train}"><div class="panel" id="sPrev">${remList()}</div>
 <button class="cta" onclick="saveSched()">${t('save')}</button>`)}
function setPreset(k){const p=SHIFTS[k];S.sched={wake:p.w,sleep:p.s,train:p.tr,preset:k};schedSheet()}
function saveSched(){const w=$('sW').value,s=$('sS').value,tr=$('sT').value;if(w&&s){S.sched={wake:w,sleep:s,train:tr||S.sched.train,preset:'custom'}}save();pushSchedule();closeSheet();render()}
function testNotif(){if(!NATIVE)return toast(t('only_android'));try{if(!AzimNative.hasNotifPermission()){AzimNative.requestNotifPermission();return}AzimNative.testNotification();toast(t('test_sent'))}catch(e){}}
function goalSheet(){openSheet(`<h2 class="w">${t('month_goal')}</h2><input class="inp" id="gI" value="${esc(S.goal)}" maxlength="34"><button class="cta" onclick="S.goal=val('gI')||S.goal;save();closeSheet();render()">${t('save')}</button>`)}
function resetSheet(){openSheet(`<h2 class="w">${t('reset_q')}</h2><p class="mu" style="margin-top:10px">${t('reset_d')}</p><button class="cta red" onclick="doReset()">${t('reset_yes')}</button><button class="cta ghost sm" onclick="closeSheet()">${t('cancel')}</button>`)}
function doReset(){Store.del('azim.data.'+USER);S=null;closeSheet();nav(false);resume()}
function delSheet(){openSheet(`<h2 class="w">${t('del_acc')}</h2><p class="mu" style="margin-top:10px">${t('delacc_d')}</p><button class="cta red" onclick="wipeAccount(USER)">${t('delacc_yes')}</button><button class="cta ghost sm" onclick="closeSheet()">${t('cancel')}</button>`)}
function invite(){const x=t('invite_text');if(NATIVE)try{return AzimNative.share(x)}catch(e){}
 if(navigator.share)navigator.share({text:x}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(x).then(()=>toast(t('copied')),()=>{})}
function exportSheet(){const data=JSON.stringify({app:'azim',v:2,user:USER,at:new Date().toISOString(),data:S});
 openSheet(`<h2 class="w">${t('export')}</h2><p class="mu" style="margin-top:8px;line-height:1.5">${t('export_d')}</p><textarea class="inp" id="exT" readonly>${esc(data)}</textarea>
 <div class="row2"><button class="cta sm" onclick="copyEx()">${t('copy')}</button><button class="cta ghost sm" onclick="NATIVE?AzimNative.share($('exT').value):copyEx()">${t('share')}</button></div>`)}
function copyEx(){const v=$('exT').value;if(navigator.clipboard)navigator.clipboard.writeText(v).then(()=>toast(t('copied')),()=>{$('exT').select()});else $('exT').select()}
function importSheet(){openSheet(`<h2 class="w">${t('import')}</h2><p class="mu" style="margin-top:8px;line-height:1.5">${t('import_d')}</p><textarea class="inp" id="imT"></textarea><button class="cta" onclick="doImport()">${t('import')}</button>`)}
function doImport(){try{const o=JSON.parse($('imT').value);if(o.app!=='azim'||!o.data||!o.data.quests)throw 0;S=o.data;S.date=S.date||ymd();save();pushSchedule();closeSheet();applyTheme();rollover();go('today');toast(t('import_ok'))}catch(e){toast(t('import_bad'))}}

/* ---------- PREMIUM ---------- */
function price(id,fb){if(PRODUCTS&&PRODUCTS[id])return PRODUCTS[id];return fb}

 const m=price('monthly',LANG==='tr'?'₺59,99':'$2.99'),y=price('yearly',LANG==='tr'?'₺399,99':'$19.99');
 openSheet(`<div class="pw"><div class="m or">${t('pw_k')}</div><h2 class="d">${t('pw_t')}</h2>${PWMSG?`<p style="color:#d8d0c5;margin-top:10px;line-height:1.5">${PWMSG}</p>`:''}
 ${[['i-list','f1','f1d'],['i-snow','f2','f2d'],['i-chart','f3','f3d'],['i-star','f4','f4d']].map(f=>`<div class="feat"><span>${ic(f[0],'width:16px;height:16px')}</span><div><b>${t(f[1])}</b><small>${t(f[2])}</small></div></div>`).join('')}
 <div class="plans"><button class="${pwPlan==='m'?'on':''}" onclick="pwPlan='m';pwRender()"><span class="m">${t('monthly')}</span><b class="w">${m}</b><small>${t('per_mo')}</small></button>
 <button class="${pwPlan==='y'?'on':''}" onclick="pwPlan='y';pwRender()"><em>${t('save_pct')}</em><span class="m">${t('yearly')}</span><b class="w">${y}</b><small>${t('per_yr')}</small></button></div>
 <button class="cta" onclick="buy()">${t('subscribe')}</button><button class="lnk" onclick="restore()">${t('restore')}</button><p class="fl2" style="text-align:center">${t('pw_note')}</p></div>`)}
function buy(){const id=pwPlan==='y'?'yearly':'monthly';
 if(NATIVE){try{AzimNative.buy(id)}catch(e){toast(t('billing_na'))}return}
 if(WEB){closeSheet();return toast(t('web_premium'))}
 Store.set('azim.demoPremium','1');closeSheet();toast(t('pw_preview'));if(S&&!S.hard)S.freezes=Math.max(S.freezes||0,1);render()}
function restore(){if(NATIVE){try{AzimNative.restorePurchases()}catch(e){}}toast(t('restored'))}
function manageSub(){if(NATIVE){try{AzimNative.manageSubscription()}catch(e){}}else{Store.del('azim.demoPremium');render()}}

/* ---------- BOOT ---------- */
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;if(view==='reg')register();else if(view==='login')login()});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)window.azimResume()});
setInterval(()=>{if(S&&S.quests&&S.date<ymd())window.azimResume()},60000);
document.documentElement.lang=LANG;
if(WEB&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
USER=Store.get('azim.session');
if(USER&&(Store.json('azim.accounts')||{})[USER])resume();else{USER=null;obGo('welcome')}

</script>
