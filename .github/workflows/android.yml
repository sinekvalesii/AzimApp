name: Android build

on:
  push:
    branches: [ main, "azim-*" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest imajında Android SDK hazır kurulu (ANDROID_HOME); eksik platformları Gradle kendisi indirir.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      # İmzalama: Settings > Secrets and variables > Actions altına şu 4 secret eklenirse release dosyaları imzalanır:
      # KEYSTORE_BASE64 (jks dosyasının base64 hali), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Release imzası (secret varsa)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > azim-upload.jks
          {
            echo "storeFile=azim-upload.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Web ve Android arayüzü aynı mı?
        run: |
          cmp docs/index.html app/src/main/assets/www/index.html
          cmp docs/privacy.html app/src/main/assets/www/privacy.html

      - name: Derle (debug APK + release AAB/APK) ve lint
        run: ./gradlew --no-daemon --stacktrace assembleDebug lintDebug bundleRelease assembleRelease

      - name: Lint özeti
        if: always()
        run: cat app/build/reports/lint.txt || true

      - name: Çıktıları yükle
        uses: actions/upload-artifact@v4
        with:
          name: azim-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/reports/lint-results-debug.html
          if-no-files-found: warn

      - name: GitHub Release (v* etiketi)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
